name: Release Extension

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "ERROR: release tag '$RELEASE_TAG' does not match package version '$package_version'." >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "vsix=.artifacts/vsix/gitea-pull-request-$package_version.vsix" >> "$GITHUB_OUTPUT"

      - name: Build, test and package release VSIX
        run: make ci

      - name: Verify release VSIX
        env:
          VSIX_FILE: ${{ steps.version.outputs.vsix }}
        run: |
          set -euo pipefail
          test -s "$VSIX_FILE"
          echo "Release VSIX: $VSIX_FILE"

      - name: Upload VSIX to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.vsix }}

      - name: Publish to VS Code Marketplace
        run: >-
          npx --yes @vscode/vsce@3.9.2 publish
          --oidc
          --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Release summary
        run: |
          echo "## Extension released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: **v${{ steps.version.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- VSIX uploaded to the GitHub release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published to VS Code Marketplace through GitHub OIDC trusted publishing" >> "$GITHUB_STEP_SUMMARY"
