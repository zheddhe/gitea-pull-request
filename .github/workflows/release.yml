name: Release Extension

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          publisher="$(node -p "require('./package.json').publisher")"
          package_name="$(node -p "require('./package.json').name")"
          tag_version="${RELEASE_TAG#v}"

          if [ "$tag_version" != "$package_version" ]; then
            echo "ERROR: release tag '$RELEASE_TAG' does not match package version '$package_version'." >&2
            exit 1
          fi
          if [ "$publisher" != "zheddhe" ]; then
            echo "ERROR: package publisher '$publisher' does not match Marketplace publisher 'zheddhe'." >&2
            exit 1
          fi
          if [ "$package_name" != "gitea-pull-request" ]; then
            echo "ERROR: unexpected package name '$package_name'." >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "vsix=.artifacts/vsix/gitea-pull-request-$package_version.vsix" >> "$GITHUB_OUTPUT"

      - name: Build, test and package release VSIX
        run: xvfb-run -a make ci

      - name: Verify release VSIX
        env:
          VSIX_FILE: ${{ steps.version.outputs.vsix }}
        run: |
          set -euo pipefail
          test -s "$VSIX_FILE"
          echo "Release VSIX: $VSIX_FILE"

      - name: Upload VSIX to GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ steps.version.outputs.vsix }}

      # Visual Studio Marketplace publication is intentionally manual for now.
      # Re-enable automated trusted publishing only after the Marketplace publisher
      # exposes/configures a trusted publishing policy for this repository/workflow.

      - name: Release summary
        run: |
          echo "## Extension released" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: **v${{ steps.version.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- VSIX uploaded to the GitHub release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Visual Studio Marketplace publication: **manual (trusted publishing pending)**" >> "$GITHUB_STEP_SUMMARY"
